<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSJ Stock Sense - Bộ Prototype UI/UX Chuỗi Màn Hình MVP (Stitch MCP)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Be Vietnam Pro', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="h-full flex flex-col">
  <!-- Top Bar -->
  <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center font-bold text-white tracking-wider mono text-sm">GSJ</div>
      <div>
        <h1 class="text-base font-bold text-white tracking-tight flex items-center gap-2">
          GSJ Stock Sense <span class="text-xs px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800 mono font-semibold">Stitch MCP Live Prototypes</span>
        </h1>
        <p class="text-xs text-slate-400">Design System: <span class="text-slate-300 font-medium">Industrial Inventory Telemetry</span> • Device: Desktop & Tablet</p>
      </div>
    </div>

    <!-- Navigation Pills -->
    <nav class="flex items-center gap-1.5 overflow-x-auto py-1">
      <button onclick="loadScreen('01_tong_quan_kho_executive.html', this)" class="screen-btn px-3 py-1.5 rounded text-xs font-semibold bg-blue-600 text-white transition-all flex items-center gap-1.5">
        <span class="mono">01</span> Tổng quan kho
      </button>
      <button onclick="loadScreen('02_can_xu_ly_hom_nay.html', this)" class="screen-btn px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1.5">
        <span class="mono">02</span> Cần xử lý <span class="bg-rose-500/20 text-rose-300 text-[10px] px-1 rounded border border-rose-500/40">93</span>
      </button>
      <button onclick="loadScreen('03_goi_y_xa_hang.html', this)" class="screen-btn px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1.5">
        <span class="mono">03</span> Gợi ý xả hàng <span class="bg-amber-500/20 text-amber-300 text-[10px] px-1 rounded border border-amber-500/40">42</span>
      </button>
      <button onclick="loadScreen('04_de_xuat_nhap_hang.html', this)" class="screen-btn px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1.5">
        <span class="mono">04</span> Đề xuất nhập PO
      </button>
      <button onclick="loadScreen('05_cham_soc_kh_va_roi.html', this)" class="screen-btn px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1.5">
        <span class="mono">05+06</span> CRM & ROI <span class="bg-emerald-500/20 text-emerald-300 text-[10px] px-1 rounded border border-emerald-500/40">+18%</span>
      </button>
      <button onclick="loadScreen('06_tablet_thu_kho_thuc_dia.html', this, true)" class="screen-btn px-3 py-1.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1.5 border border-indigo-500/30">
        <span class="mono">06</span> 📱 Tablet Thủ kho
      </button>
    </nav>

    <!-- External Link -->
    <div class="flex items-center gap-2">
      <a id="openTabBtn" href="01_tong_quan_kho_executive.html" target="_blank" class="px-2.5 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded transition flex items-center gap-1">
        <span>Mở tab riêng</span> ↗
      </a>
    </div>
  </header>

  <!-- Main Preview Container -->
  <main class="flex-1 bg-slate-950 flex items-center justify-center p-2 relative overflow-hidden">
    <div id="frameWrapper" class="w-full h-full rounded border border-slate-800 overflow-hidden bg-white shadow-2xl transition-all duration-300 flex flex-col">
      <iframe id="previewFrame" src="01_tong_quan_kho_executive.html" class="w-full h-full border-0"></iframe>
    </div>
  </main>

  <script>
    function loadScreen(file, btn, isTablet = false) {
      const frame = document.getElementById('previewFrame');
      const wrapper = document.getElementById('frameWrapper');
      const openBtn = document.getElementById('openTabBtn');
      
      frame.src = file;
      openBtn.href = file;

      // Adjust container width for tablet vs desktop
      if (isTablet) {
        wrapper.className = "w-[1024px] max-w-full h-[95%] rounded-xl border-4 border-slate-700 overflow-hidden bg-white shadow-2xl transition-all duration-300 my-auto";
      } else {
        wrapper.className = "w-full h-full rounded border border-slate-800 overflow-hidden bg-white shadow-2xl transition-all duration-300 flex flex-col";
      }

      // Update button active state
      document.querySelectorAll('.screen-btn').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-300');
      });
      btn.classList.add('bg-blue-600', 'text-white');
      btn.classList.remove('bg-slate-800', 'text-slate-300');
    }
  </script>
</body>
</html>
